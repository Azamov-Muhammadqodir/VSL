name: CI

# Documentation, screenshots and the Visual Studio extension (built by vsix.yml) do not touch the Linux build.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'src/VSL.VisualStudio/**', '.github/workflows/vsix.yml', '.github/workflows/release.yml']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'src/VSL.VisualStudio/**', '.github/workflows/vsix.yml', '.github/workflows/release.yml']

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore VSL.slnx

      - name: Build
        run: dotnet build VSL.slnx -c Release --no-restore

      # Unit tests plus the headless UI tests of the main window; the integration tests restore and build a
      # sample Blazor solution, install roslyn-language-server and netcoredbg, and drive a fake Claude Code CLI.
      # Normally ~3 min. Each test is listed as it finishes, and one that hangs for 5 minutes is named and the run fails.
      - name: Test
        timeout-minutes: 15
        run: dotnet test VSL.slnx -c Release --no-build --blame-hang-timeout 5m --blame-hang-dump-type none --logger "console;verbosity=normal"
